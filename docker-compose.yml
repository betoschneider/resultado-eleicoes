services:
  apuracao:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apuracao-eleicoes
    restart: unless-stopped
    ports:
      - "8540:8540"
    env_file:
      - .env
    volumes:
      # Volume nomeado gerenciado pelo Docker: a posse inicial é herdada de
      # /app/data (já pertencente ao appuser) definida no Dockerfile.
      # Evita o problema de bind mount criado como root no host, que impede
      # o appuser (UID 1000) de criar o arquivo SQLite.
      - eleicoes_data:/app/data
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

volumes:
  eleicoes_data:
